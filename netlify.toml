# Netlify deployment for UbiMap.
#
# The site is a static build. Netlify serves dist/ and nothing else needs to run,
# which means there is no server to go down while the judges are looking at it.
#
# Deploy with either:
#   npx netlify deploy --prod --dir=dist
# or by dragging the dist folder onto https://app.netlify.com/drop
#
# GitHub Pages works too. See .github/workflows/deploy.yml.

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The app is a single page with client side routing by step, so every unknown path
# returns the same index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The NASA POWER proxy. The API sends no CORS headers, so a browser on another origin
# cannot call it directly. This is the only server side piece of UbiMap.
[[redirects]]
  from = "/api/power/*"
  to = "/.netlify/functions/power/:splat"
  status = 200
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
